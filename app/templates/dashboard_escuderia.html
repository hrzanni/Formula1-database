{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">{{ info.nome }}</h2>

<div class="row g-3 mb-4">
  <div class="col-md-3">
    <div class="card text-center border-0 shadow-sm p-3">
      <div class="text-muted small">Vitórias</div>
      <div class="display-5 fw-bold">{{ info.vitorias }}</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-center border-0 shadow-sm p-3">
      <div class="text-muted small">Pilotos distintos</div>
      <div class="display-5 fw-bold">{{ info.total_pilotos }}</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-center border-0 shadow-sm p-3">
      <div class="text-muted small">Primeiro ano</div>
      <div class="display-5 fw-bold">{{ info.primeiro_ano }}</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-center border-0 shadow-sm p-3">
      <div class="text-muted small">Último ano</div>
      <div class="display-5 fw-bold">{{ info.ultimo_ano }}</div>
    </div>
  </div>
</div>

<div class="d-flex gap-2">
  <a href="/buscar/piloto"    class="btn btn-outline-primary">Buscar piloto por sobrenome</a>
  <a href="/importar/pilotos" class="btn btn-outline-secondary">Importar pilotos via CSV</a>
</div>
{% endblock %}
