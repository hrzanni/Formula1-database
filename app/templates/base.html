<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 Database — SCC541 G09</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }
    .table th { background-color: #212529; color: #fff; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
  <span class="navbar-brand">🏎 F1 Database</span>
  {% if session.login %}
    <div class="d-flex align-items-center gap-2">
      <span class="text-white-50 small">{{ session.login }} ({{ session.tipo }})</span>
      <a href="/dashboard"  class="btn btn-sm btn-outline-light">Dashboard</a>
      <a href="/relatorios" class="btn btn-sm btn-outline-warning">Relatórios</a>
      <a href="/logout"     class="btn btn-sm btn-outline-danger">Sair</a>
    </div>
  {% endif %}
</nav>

<div class="container mt-4 mb-5">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
