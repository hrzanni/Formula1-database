{% extends 'base.html' %}
{% block content %}
<div class="row">
  <div class="col-md-6">
    <h3 class="mb-4">{{ titulo }}</h3>
    <form method="POST" {% if upload %}enctype="multipart/form-data"{% endif %}>
      {% if upload %}
        <div class="mb-3">
          <label class="form-label">Arquivo CSV</label>
          <input type="file" name="arquivo" class="form-control" accept=".csv" required>
          <div class="form-text">
            Colunas esperadas: <code>driver_ref, given_name, family_name, date_of_birth, nationality</code>
          </div>
        </div>
      {% else %}
        {% for name, label, required in campos %}
        <div class="mb-3">
          <label class="form-label">{{ label }}{% if required %} <span class="text-danger">*</span>{% endif %}</label>
          <input name="{{ name }}" class="form-control" {% if required %}required{% endif %}>
        </div>
        {% endfor %}
      {% endif %}
      <div class="d-flex gap-2">
        <button class="btn btn-dark">Enviar</button>
        <a href="/dashboard" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
